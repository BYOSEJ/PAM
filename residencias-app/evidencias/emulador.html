<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Residencias Connect · Emulador UI</title><style>

t-size:10px;font-weight:700;cursor:pointer}.filter.sel{background:#142b4a;color:white;border-color:#142b4a}.results{display:flex;justify-content:space-between;font-size:11px;margin-bottom:11px}.jobtop{display:flex;align-items:center;gap:11px}.logo{width:43px;height:43px;border-radius:13px;background:#eaf1ff;color:#2563eb;font-weight:900;display:grid;place-items:center}.company{font-size:11px;color:#718096;font-weight:600}.jobtitle{font-size:14px;color:#182638;font-weight:800;margin-top:3px}.arrow{margin-left:auto;color:#9aa8b8;font-size:27px}.tags{display:flex;gap:7px;margin-top:13px;flex-wrap:wrap}.tag{font-size:10px;font-weight:700;padding:6px 10px;border-radius:20px;background:#edf3ff;color:#315eae}.tag.green{background:#e7f7f1;color:#16866e}.tag.orange{background:#fff5e5;color:#b7791f}.tech{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tech span{font-size:10px;color:#526276;background:#f4f6f9;padding:5px 9px;border-radius:7px}.jobfoot{border-top:1px solid #eef1f5;margin-top:13px;padding-top:11px;display:flex;justify-content:space-between;color:#718096;font-size:10px}.back{color:#2563eb;font-weight:800;font-size:12px;margin-bottom:18px;cursor:pointer}.companybox{background:white;border:1px solid #e6ecf2;border-radius:16px;padding:14px;display:flex;align-items:center;gap:11px}.companybox .co{font-size:12px;font-weight:800;color:#142b4a}.companybox .cat{font-size:10px;color:#718096;margin-top:4px}.detailtitle{font-size:25px;line-height:31px;color:#142b4a;font-weight:900;margin:21px 0 12px}.infogrid{display:flex;gap:10px;margin-top:20px}.info{flex:1;background:white;border:1px solid #e6ecf2;border-radius:14px;padding:13px;box-shadow:0 5px 14px #1b355510}.infoico{color:#0f9d91;font-size:18px}.label{font-size:8px;letter-spacing:1px;color:#718096;font-weight:800;margin-top:7px}.value{font-size:11px;color:#142b4a;font-weight:800;margin-top:4px}.sectionbox{background:white;border:1px solid #e6ecf2;border-radius:16px;padding:16px;margin-top:13px}.sectionbox h3{font-size:14px;color:#142b4a;margin:0 0 10px}.sectionbox p{font-size:11px;color:#5d6b7c;line-height:18px;margin:0}.req{font-size:11px;color:#5d6b7c;margin:8px 0;display:flex;gap:9px}.check{color:#0f9d91;font-weight:900}.footer{background:#fff;border-top:1px solid #e6ecf2;padding:12px 20px 17px;flex-shrink:0}.apply{width:100%;border:0;background:#2563eb;color:white;border-radius:13px;padding:15px;font-weight:900;font-size:12px;cursor:pointer}.footnote{text-align:center;font-size:9px;color:#718096;margin-top:8px}
</style></head><body><div class="phone"><div class="top"><div class="mark">R</div><div class="brand">residencias<span>.connect</span></div><div class="right">♧　●</div></div><main class="main" id="main"></main><nav class="bottom" id="bottom"><div class="nav active" onclick="showHome()"><b>⌂</b>Inicio</div><div class="nav" onclick="showJobs()"><b>▤</b>Vacantes</div></nav></div>
<script>
const jobs=[{id:1,title:'Desarrollo de app de inventarios',company:'NovaTech Solutions',cat:'Desarrollo de software',mode:'Híbrido',place:'Puebla, Pue.',tech:['React Native','JavaScript','Firebase'],duration:'6 meses',desc:'Diseñar y desarrollar una aplicación móvil para administrar inventarios, registrar movimientos de productos y consultar reportes en tiempo real.',req:['Conocimientos básicos de JavaScript','Fundamentos de desarrollo móvil','Manejo de bases de datos','Trabajo colaborativo y documentación'],advisor:'Mtra. Laura Méndez'},{id:2,title:'Análisis de datos de producción',company:'Industrias del Centro',cat:'Datos y analítica',mode:'Presencial',place:'Cuautlancingo, Pue.',tech:['Python','Excel','Power BI'],duration:'5 meses',desc:'Analizar información de líneas de producción para identificar tendencias, crear indicadores y proponer mejoras basadas en datos.',req:['Estadística descriptiva','Conocimientos de Python o Excel','Visualización de datos','Comunicación de resultados'],advisor:'Ing. Roberto Salas'},{id:3,title:'Sitio web para gestión de clientes',company:'Grupo Creativo MX',cat:'Tecnologías web',mode:'Remoto',place:'Remoto · México',tech:['HTML','CSS','React'],duration:'6 meses',desc:'Construir una plataforma web adaptable para registrar clientes, dar seguimiento a solicitudes y consultar información comercial.',req:['HTML y CSS','JavaScript','Diseño adaptable','Control de versiones con Git'],advisor:'Lic. Daniela Cruz'},{id:4,title:'Automatización de reportes',company:'Logística Ágil',cat:'Automatización',mode:'Híbrido',place:'Puebla, Pue.',tech:['Python','SQL','Excel'],duration:'4 meses',desc:'Crear herramientas para concentrar datos operativos y generar reportes periódicos que faciliten la toma de decisiones.',req:['Lógica de programación','Consultas SQL básicas','Manejo de hojas de cálculo','Atención al detalle'],advisor:'Ing. Carlos Vega'}];
let filter='Todas',query='',current=null,applied=false;
function showHome(){document.getElementById('detailFooter')?.remove();current=null;document.getElementById('bottom').style.display='flex';document.getElementById('bottom').innerHTML='<div class="nav active" onclick="showHome()"><b>⌂</b>Inicio</div><div class="nav" onclick="showJobs()"><b>▤</b>Vacantes</div>';document.getElementById('main').innerHTML=`<div class="head"><div><div class="eyebrow">PORTAL DE RESIDENCIAS</div><div class="greeting">¡Hola, Alex! 👋</div><div class="sub">Tu siguiente paso profesional comienza aquí.</div></div><div class="avatar">AM</div></div><div class="hero"><small>CICLO ESCOLAR 2026</small><h2>Construye tu futuro profesional</h2><p>Encuentra un proyecto que impulse tu talento.</p><button onclick="showJobs()">Explorar vacantes　→</button><div class="spark">✦</div></div><h3 class="section">Tu progreso</h3><div class="stats"><div class="stat"><div class="ico">⌕</div><div class="num">12</div><div class="muted">Vacantes disponibles</div></div><div class="stat"><div class="ico" style="color:#f59e0b">◷</div><div class="num">2</div><div class="muted">Trámites pendientes</div></div></div><div class="card"><div class="row between"><b class="status">Estado de residencia</b><span class="pill">En búsqueda</span></div><div class="body">Aún no tienes un proyecto asignado. Explora las oportunidades disponibles y encuentra la indicada para ti.</div><div class="track"><div class="fill"></div></div><div class="caption">Etapa 1 de 4 · Búsqueda de proyecto</div></div><div class="row between"><h3 class="section">Avisos de coordinación</h3><span style="font-size:10px;color:#2563eb;font-weight:700">Ver todos</span></div><div class="notice"><div class="noticeico">📄</div><div><div class="ntitle">Documentación inicial</div><div class="ntext">Revisa los formatos necesarios para iniciar tu proceso.</div><div class="date">Hoy · 09:30 h</div></div></div><div class="notice"><div class="noticeico" style="background:#fff5e5">📅</div><div><div class="ntitle">Sesión informativa</div><div class="ntext">Conoce las fechas importantes del periodo.</div><div class="date">Ayer · 12:15 h</div></div></div>`}
function showJobs(){document.getElementById('detailFooter')?.remove();current=null;document.getElementById('bottom').style.display='flex';document.getElementById('bottom').innerHTML='<div class="nav" onclick="showHome()"><b>⌂</b>Inicio</div><div class="nav active" onclick="showJobs()"><b>▤</b>Vacantes</div>';renderJobs()}
function renderJobs(){let list=jobs.filter(j=>(filter==='Todas'||j.mode===filter)&&(`${j.title} ${j.company} ${j.tech.join(' ')}`).toLowerCase().includes(query.toLowerCase()));document.getElementById('main').innerHTML=`<div class="eyebrow">OPORTUNIDADES PARA TI</div><div class="pageTitle">Explora vacantes</div><div class="sub">Encuentra un proyecto alineado con tus habilidades e intereses.</div><div class="search"><span>⌕</span><input placeholder="Buscar proyecto o tecnología..." value="${query}" oninput="query=this.value;renderJobs()"><span style="color:#2563eb">☷</span></div><div class="filters">${['Todas','Presencial','Híbrido','Remoto'].map(f=>`<button class="filter ${filter===f?'sel':''}" onclick="filter='${f}';renderJobs()">${f}</button>`).join('')}</div><div class="results"><b>${list.length} oportunidades</b><span style="color:#718096">Más recientes ↓</span></div>${list.length?list.map(j=>`<div class="card" onclick="showDetail(${j.id})"><div class="jobtop"><div class="logo">${j.company.split(' ').map(x=>x[0]).slice(0,2).join('')}</div><div><div class="company">${j.company}</div><div class="jobtitle">${j.title}</div></div><div class="arrow">›</div></div><div class="tags"><span class="tag ${j.mode==='Presencial'?'orange':'green'}">${j.mode}</span><span class="tag">${j.cat}</span></div><div class="tech">${j.tech.map(t=>`<span>${t}</span>`).join('')}</div><div class="jobfoot"><span>⌖　${j.place}</span><b style="color:#142b4a">${j.duration}</b></div></div>`).join(''):'<div class="card">No encontramos resultados. Prueba otra búsqueda.</div>'}`}
function showDetail(id){document.getElementById('detailFooter')?.remove();current=jobs.find(j=>j.id===id);applied=false;document.getElementById('bottom').style.display='none';let j=current;document.getElementById('main').innerHTML=`<div class="back" onclick="showJobs()">‹　Volver a vacantes</div><div class="companybox"><div class="logo">${j.company.split(' ').map(x=>x[0]).slice(0,2).join('')}</div><div style="flex:1"><div class="co">${j.company}</div><div class="cat">${j.cat}</div></div><span class="pill">Activa</span></div><div class="detailtitle">${j.title}</div><div class="tags"><span class="tag ${j.mode==='Presencial'?'orange':'green'}">${j.mode}</span><span class="tag">${j.duration}</span></div><div class="infogrid"><div class="info"><div class="infoico">⌖</div><div class="label">UBICACIÓN</div><div class="value">${j.place}</div></div><div class="info"><div class="infoico">◷</div><div class="label">DURACIÓN</div><div class="value">${j.duration}</div></div></div><div class="sectionbox"><h3>Sobre el proyecto</h3><p>${j.desc}</p></div><div class="sectionbox"><h3>Tecnologías requeridas</h3><div class="tags" style="margin:0">${j.tech.map(t=>`<span class="tag">${t}</span>`).join('')}</div></div><div class="sectionbox"><h3>Requisitos</h3>${j.req.map(r=>`<div class="req"><span class="check">✓</span>${r}</div>`).join('')}</div><div class="sectionbox"><div class="label" style="margin:0">CONTACTO DE LA EMPRESA</div><div class="value">${j.advisor}</div></div>`;document.body.querySelector('.phone').insertAdjacentHTML('beforeend','<div class="footer" id="detailFooter"><button class="apply" id="applyBtn" onclick="applyNow()">Postularme a esta vacante　→</button><div class="footnote">Al postularte, coordinación podrá dar seguimiento a tu solicitud.</div></div>')}
function applyNow(){applied=true;document.getElementById('applyBtn').textContent='✓　Postulación registrada';document.getElementById('applyBtn').style.background='#16866e'}
if(location.hash==='#jobs') showJobs(); else if(location.hash==='#detail') showDetail(1); else showHome();
</script></body></html>
